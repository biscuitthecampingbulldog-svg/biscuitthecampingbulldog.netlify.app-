<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanks for Joining the Pack! 🐾 | Biscuit the Camping Bulldog</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bark:#5C3D2E; --cream:#FDF6EC; --gold:#C8922A; --white:#FFFFFF;
    --shadow:rgba(92,61,46,0.16);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Nunito',sans-serif;background:var(--cream);color:var(--bark);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:1.5rem;text-align:center;
  }
  .card{
    background:var(--white);border-radius:20px;box-shadow:0 8px 32px var(--shadow);
    padding:2.5rem 2rem;max-width:440px;width:100%;
  }
  .logo{width:110px;height:110px;border-radius:50%;margin:0 auto 1.2rem;display:block;}
  h1{font-family:'Fredoka One',cursive;font-size:1.7rem;color:var(--bark);margin-bottom:0.8rem;}
  p{font-size:1rem;line-height:1.6;color:#6b5044;margin-bottom:1.6rem;}
  .btn{
    display:inline-block;background:var(--gold);color:#fff;font-weight:700;
    text-decoration:none;padding:0.85rem 1.8rem;border-radius:999px;font-size:1rem;
  }
  .paw{font-size:1.3rem;}
</style>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-T6H2CSSG6B"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-T6H2CSSG6B');
</script></head>
<body>
  <div class="card">
    <img class="logo" src="images/biscuit-logo.webp" alt="Biscuit the Camping Bulldog official logo">
    <h1>You're in the Pack! <span class="paw">🐾</span></h1>
    <p>Thanks for signing up! Keep an eye on your inbox for camping tips, gear picks, and the occasional trail story from Biscuit and the crew.</p>
    <a class="btn" href="/">🏕️ Back to Biscuit's Site</a>
  </div>
</body>
</html>
