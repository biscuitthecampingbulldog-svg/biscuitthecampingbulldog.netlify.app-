<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanks for Joining the Pack! 🐾 | Biscuit the Camping Bulldog</title>
  <meta name="robots" content="noindex">

  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">

  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --bark:#5C3D2E; --pine:#2D5016; --blush:#E8A0A0;
      --tan:#D4A96A;  --cream:#FDF6EC; --smoke:#F0EBE3;
      --gold:#C8922A; --white:#FFFFFF; --shadow:rgba(92,61,46,0.16);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Nunito',sans-serif;background:var(--cream);color:var(--bark);}
    .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3rem 1.5rem;}
    .card{background:var(--white);border-radius:24px;box-shadow:0 12px 32px var(--shadow);padding:3rem 2.5rem;max-width:480px;}
    .paw{font-size:3rem;margin-bottom:0.5rem;}
    h1{font-family:'Fredoka One',cursive;font-size:clamp(1.6rem,4vw,2.2rem);color:var(--bark);margin:0 0 0.75rem;}
    p{font-size:1.02rem;line-height:1.6;opacity:0.85;margin:0 0 1.75rem;}
    .btn{display:inline-block;background:var(--gold);color:#fff;font-weight:700;text-decoration:none;padding:0.8rem 1.8rem;border-radius:999px;font-size:0.98rem;transition:transform 0.15s ease;}
    .btn:hover{transform:translateY(-2px);}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="paw">🐾</div>
      <h1>You're in the Pack!</h1>
      <p>Thanks for signing up — keep an eye on your inbox for Biscuit's camping tips, gear picks, and trail stories from the Smoky Mountains. No spam, just tail wags.</p>
      <a class="btn" href="/">🏕️ Back to Biscuit's Page</a>
    </div>
  </div>
</body>
</html>
